---
name: Bug report
description: Report a bug in TriVM (assembler, VM, or CLI)
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include minimal .tri source or test code if possible
      placeholder: |
        1. Write `cargo run -- examples/bug.tri`
        2. See error: ...
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Assembler
        - VM execution
        - Instruction encoding
        - CLI
        - Documentation
        - Other
